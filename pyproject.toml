[project]
name = "hp-printer"
version = "0.1.0rc4"
description = "ICTHub authenticated IPP gateway and Windows printer installer"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "PyJWT[crypto]>=2.10,<3",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[project.scripts]
hp-printer = "hp_printer.cli:app"
icthub-printer = "hp_printer.windows:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
build = ["pyinstaller>=6.16,<7"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hp_printer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
