name: Windows Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.17"
      - name: Build installer
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*
      - name: Prepare draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME dist/ICTHubPrinterSetup.exe dist/SHA256SUMS.txt --draft --verify-tag --title "ICTHub Printer $env:GITHUB_REF_NAME" --notes-file docs/release-notes.md
