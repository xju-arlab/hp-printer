name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.17"
      - name: Build installer
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*
      - name: Prepare draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME dist/ICTHubPrinterSetup.exe dist/SHA256SUMS.txt --draft --verify-tag --title "实验室打印机 $env:GITHUB_REF_NAME" --notes-file docs/release-notes.md
  macos:
    needs: windows
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.17"
      - name: Build DMG
        run: bash scripts/build-macos.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer-${{ runner.arch }}
          path: dist/*
      - name: Attach DMG to draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/ICTHubPrinter-macos-$(uname -m).dmg dist/SHA256SUMS-macos.txt --clobber
